# Test-only continuous integration. No release, publish, or deployment steps:
# see AGENTS.md ("No automatic release, publish, or deployment workflows").
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: verify (install, build, typecheck, tests, evals, examples, packaging)
        run: bash scripts/verify.sh
