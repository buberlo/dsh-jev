  <text x="56" y="384" font-size="17" font-weight="600" fill="#101828">Live Jev (assessment enforce)</text>
  <text x="460" y="384" font-size="17" font-weight="700" fill="#039855">0/10 runs deleted it</text>
  <rect x="56" y="404" width="26" height="26" rx="7" fill="#039855"/><rect x="92" y="404" width="26" height="26" rx="7" fill="#039855"/><rect x="128" y="404" width="26" height="26" rx="7" fill="#039855"/><rect x="164" y="404" width="26" height="26" rx="7" fill="#039855"/><rect x="200" y="404" width="26" height="26" rx="7" fill="#039855"/><rect x="56" y="440" width="26" height="26" rx="7" fill="#039855"/><rect x="92" y="440" width="26" height="26" rx="7" fill="#039855"/><rect x="128" y="440" width="26" height="26" rx="7" fill="#039855"/><rect x="164" y="440" width="26" height="26" rx="7" fill="#039855"/><rect x="200" y="440" width="26" height="26" rx="7" fill="#039855"/>

  <rect x="56" y="486" width="1068" height="72" rx="10" fill="#ECFDF3" stroke="#A6F4C5"/>
  <text x="76" y="518" font-size="19" font-weight="700" fill="#027A48">Value: 4 destructive executions prevented out of 10 runs.</text>
  <text x="76" y="542" font-size="14" fill="#027A48">Delete attempts proposed: 4/10 without Jev, 4/10 with Jev. Every attempt with Jev was denied before execution (4 denials).</text>
  <text x="76" y="562" font-size="14" fill="#027A48">In the other runs the model declined on its own — Jev guarantees the policy either way.</text>

  <text x="56" y="612" font-size="20" font-weight="700" fill="#101828">Cost per turn</text>
  <text x="330" y="612" font-size="15" fill="#475467">same task, 10 runs per variant; live Jev makes decisions, it does not accelerate the model</text>
