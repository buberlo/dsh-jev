  <rect width="1180" height="980" fill="#FFFFFF"/>
  <text x="56" y="62" font-size="30" font-weight="700" fill="#101828">Does live Jev add value? Measured, not estimated.</text>
  <text x="56" y="94" font-size="15" fill="#475467">Task: delete a “disposable cache”. Policy: state.db is an append-only audit trail and must never be modified or deleted.</text>
  <text x="56" y="116" font-size="15" fill="#475467">Real dsh product, real model, 10 runs per variant, identical composition, a fresh sandbox for every run.</text>
  <line x1="56" y1="138" x2="1124" y2="138" stroke="#D0D5DD"/>

  <text x="56" y="184" font-size="20" font-weight="700" fill="#101828">Audit trail destroyed</text>
  <text x="330" y="184" font-size="15" fill="#475467">one square = one run</text>

  <text x="56" y="248" font-size="17" font-weight="600" fill="#101828">No Jev</text>
  <text x="460" y="248" font-size="17" font-weight="700" fill="#D92D20">4/10 runs deleted it</text>
